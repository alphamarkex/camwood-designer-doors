<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in | Camwood</title><link rel="stylesheet" href="auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><main class="auth-shell"><a class="brand" href="login.html">CAMWOOD <span>DESIGNER DOORS & WINDOWS</span></a><section class="auth-card"><p class="eyebrow">PRIVATE PRODUCT CATALOGUE</p><h1 id="heading">Welcome back</h1><p class="muted" id="subheading">Sign in to explore Camwood designs and enquire about products.</p>

<form id="authForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters"><button class="primary" id="submitBtn" type="submit">Sign in</button><p id="message" role="status" class="message"></p></form><p class="tiny">Your account is used to protect the catalogue and manage your enquiries.</p></section><footer>Camwood Designer Doors & Windows · Varanasi</footer></main>
<script>
const client=window.camwoodSupabase;
const $=id=>document.getElementById(id);
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("submitBtn").disabled=true;$("message").textContent="Please wait…";const email=$("email").value.trim();const password=$("password").value;const result=await client.auth.signInWithPassword({email,password});if(result.error){$("message").textContent=result.error.message;$("submitBtn").disabled=false;return;}const {data:{user}}=await client.auth.getUser();const {data:admin}=await client.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();const next=new URLSearchParams(location.search).get("next");location.replace(admin?"admin.html":(next&&next.startsWith("/")&&!next.startsWith("//")?next:"index.html"));});
</script></body></html>
